name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use default .env
        run: mv .env.example .env
      - name: Install Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Compile contracts
        run: npm run compile
      - name: Hardhat Tests
        run: FORK_BLOCK_NUMBER=49605395 npm run test
      - name: Hardhat Fork Tests Ethereum
        run: npm run test:ethereum
      - name: Hardhat Fork Tests Gnosis Chain
        run: npm run test:gnosis
      - name: Hardhat Fork Tests Arbitrum One Chain
        run: npm run test:arbitrumone
      - name: Hardhat Fork Tests Polygon
        run: npm run test:polygon
      - name: Hardhat Simulation Tests Tempo Chain
        run: npm run test:tempo
      - name: Hardhat Simulation Tests Stable Chain
        run: npm run test:stable
      - name: Script Tests
        run: npm run test:scripts
